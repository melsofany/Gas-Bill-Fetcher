openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Petrotrade Invoice Extractor API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scraper
    description: Scraping operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scraper/accounts:
    get:
      operationId: getAccounts
      tags: [scraper]
      summary: Get account numbers from Google Sheet
      responses:
        "200":
          description: List of account numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scraper/run:
    post:
      operationId: runScraper
      tags: [scraper]
      summary: Start scraping invoices for all accounts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScraperRunInput"
      responses:
        "200":
          description: Scraping job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScraperJob"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scraper/status/{jobId}:
    get:
      operationId: getJobStatus
      tags: [scraper]
      summary: Get scraping job status and results
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScraperJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scraper/pdf/{jobId}:
    get:
      operationId: downloadPdf
      tags: [scraper]
      summary: Download PDF report for completed job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: string
        count:
          type: integer
      required:
        - accounts
        - count

    ScraperRunInput:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: string
          description: Optional subset of accounts to scrape

    InvoiceResult:
      type: object
      properties:
        accountNumber:
          type: string
        consumption:
          type: ["string", "null"]
          description: الاستهلاك
        creditAdjustment:
          type: ["string", "null"]
          description: تسوية مدينة
        advanceBalance:
          type: ["string", "null"]
          description: رصيد دفعات مقدمة
        amount:
          type: ["string", "null"]
          description: القيمة
        issueMonth:
          type: ["string", "null"]
          description: شهر الإصدار
        status:
          type: string
          enum: [success, error, pending]
        error:
          type: ["string", "null"]
      required:
        - accountNumber
        - status

    ScraperJob:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [running, completed, failed]
        totalAccounts:
          type: integer
        processedAccounts:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceResult"
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]
        pdfReady:
          type: boolean
      required:
        - jobId
        - status
        - totalAccounts
        - processedAccounts
        - results
        - startedAt
        - pdfReady

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
